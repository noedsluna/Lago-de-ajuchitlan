<!DOCTYPE html>
<html lang="es"><head>
  <script>if(window.location.protocol==='file:'){window.location.replace('http://127.0.0.1:5000/registro');}</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | Lago de Ajuchitlán</title><link rel="stylesheet" href="css/estilos.css"></head>
<body class="auth-page"><header class="topbar"><a class="brand" href="/"><img src="img/logo-ajuchitlan.png" class="brand-logo" alt=""><span>Lago de<br><strong>Ajuchitlán</strong></span></a><a href="/" class="login-link">← Volver al inicio</a></header>
<main class="auth-main"><section class="auth-card"><p class="eyebrow dark">FORMA PARTE DE LA COMUNIDAD</p><h1>Crear cuenta</h1><p>Regístrate para acceder a las funciones adicionales.</p><form id="demoForm" method="post" action="/registro"><label for="name">Nombre completo</label><input id="name" name="name" type="text" maxlength="100" placeholder="Tu nombre" autocomplete="name" required><label for="email">Correo electrónico</label><input id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required><label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required><button class="button button-primary" type="submit">Crear cuenta</button><p class="auth-note" id="authNote">Tu contraseña se guardará como hash en la base de datos local; no se guarda como texto legible.</p></form><p class="auth-switch">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p><a class="visitor-link" href="/">Continuar como visitante →</a></section></main>
<script>
const params=new URLSearchParams(location.search); const note=document.querySelector('#authNote');
if(params.get('error')==='datos') note.textContent='Revisa tu nombre, correo y contraseña. La contraseña debe tener al menos 8 caracteres.';
if(params.get('error')==='existe') note.textContent='Ya existe una cuenta con ese correo. Inicia sesión o utiliza otro correo.';
</script></body></html>
