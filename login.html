<!DOCTYPE html>
<html lang="es"><head>
  <script>if(window.location.protocol==='file:'){window.location.replace('http://127.0.0.1:5000/login');}</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | Lago de Ajuchitlán</title><link rel="stylesheet" href="css/estilos.css"></head>
<body class="auth-page"><header class="topbar"><a class="brand" href="/"><img src="img/logo-ajuchitlan.png" class="brand-logo" alt=""><span>Lago de<br><strong>Ajuchitlán</strong></span></a><a href="/" class="login-link">← Volver al inicio</a></header>
<main class="auth-main"><section class="auth-card"><p class="eyebrow dark">BIENVENIDO DE NUEVO</p><h1>Iniciar sesión</h1><p>Accede a tu cuenta del Lago de Ajuchitlán.</p><form id="demoForm" method="post" action="/login"><label for="email">Correo electrónico o usuario</label><input id="email" name="email" type="text" placeholder="Tu correo electrónico" autocomplete="username" required><label for="password">Contraseña</label><input id="password" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required><button class="button button-primary" type="submit">Iniciar sesión</button><p class="auth-note" id="authNote">Ingresa con las credenciales de tu cuenta.</p></form><p class="auth-switch">¿No tienes cuenta? <a href="/registro">Regístrate</a></p><a class="visitor-link" href="/">Continuar como visitante →</a></section></main>
<script>
const params=new URLSearchParams(location.search); const note=document.querySelector('#authNote');
if(params.has('error')) note.textContent='No se pudo iniciar sesión. Revisa tu correo y contraseña e inténtalo de nuevo.';
if(params.has('registered')) note.textContent='Cuenta creada correctamente. Ya puedes iniciar sesión.';
</script></body></html>
